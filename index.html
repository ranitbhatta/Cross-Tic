<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cross Tic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="root">

    <!-- Title -->
    <h1 class="title">Cross Tic</h1>

    <!-- Scoreboard -->
    <div class="score-card">
      <div id="xScore" class="score">✖: 0</div>
      <div id="drawScore" class="score">Draws: 0</div>
      <div id="oScore" class="score">◯: 0</div>
    </div>

    <!-- Tic Tac Toe Grid -->
    <div class="grid" id="grid">
      <button id="btn0" class="cell"></button>
      <button id="btn1" class="cell"></button>
      <button id="btn2" class="cell"></button>
      <button id="btn3" class="cell"></button>
      <button id="btn4" class="cell"></button>
      <button id="btn5" class="cell"></button>
      <button id="btn6" class="cell"></button>
      <button id="btn7" class="cell"></button>
      <button id="btn8" class="cell"></button>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <button id="btnRestart" class="btn blue">Restart</button>
      <button id="btnReset" class="btn gray">Reset</button>
      <button id="btnModeToggle" class="btn indigo">Computer</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
